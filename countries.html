<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>国家攻略</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>国家攻略</h1>
</header>

<main>

<div class="country-card">
  <div class="country-header">
    <h2>🇷🇺 俄罗斯</h2>
    <span class="difficulty">难度 ⭐⭐⭐⭐⭐</span>
  </div>

  <p class="summary">
    西里尔字母、蓝底白字路牌、黑白路边柱。国家容易认，地区很难猜。
  </p>

  <div class="tag-row">
    <span>右侧行驶</span>
    <span>西里尔字母</span>
    <span>范围巨大</span>
  </div>

  <h3>快速识别</h3>
  <ul>
    <li>俄文西里尔字母</li>
    <li>蓝底白字路牌</li>
    <li>黑白相间路边柱</li>
    <li>远东地区可能出现右舵车</li>
  </ul>
</div>

</main>

</body>
</html>
